<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>PokéStadium TD — 3D Tower Defense</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Impact&family=Teko:wght@600;700&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --stadium-gold: #FFD700;
      --stadium-blue: #0A3871;
      --stadium-navy: #041226;
      --stadium-red: #D62828;
      --stadium-metal: #7B8D9E;
      --stadium-light-metal: #BCC5CF;
      --stadium-cyan: #00F0FF;
      --stadium-green: #2EC4B6;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      margin: 0;
      padding: 0;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #030811;
      font-family: 'Rajdhani', 'Impact', sans-serif;
      color: #fff;
    }

    #game-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: radial-gradient(circle at center, #0B1E38 0%, #030811 100%);
    }

    #stadium-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: block;
      z-index: 1;
    }

    /* Main UI Layer */
    #ui-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 20;
      filter: saturate(var(--retro-sat, 1));
    }

    .interactive {
      pointer-events: auto;
    }

    /*
     * CSS approximation of RetroFX's shader pass, for the DOM HUD the canvas
     * post-process never touches. Sits above every game-UI layer so the HUD
     * reads as the same CRT as the 3D view, but stays below #dev-panel (its
     * settings need to stay legible while you're tuning them). Curvature,
     * chroma and colour-bit dithering have no cheap DOM equivalent and stay
     * canvas-only; see RetroFX.applyRetroUiCss for the settings mapping.
     */
    #retro-ui-fx {
      position: absolute;
      inset: 0;
      z-index: 94;
      pointer-events: none;
    }
    #retro-ui-fx > div {
      position: absolute;
      inset: 0;
    }
    #retro-ui-fx .retro-scan {
      background-image:
        repeating-linear-gradient(to bottom, rgba(0, 0, 0, var(--retro-scan, 0)) 0 1px, transparent 1px var(--retro-scan-gap, 4px)),
        repeating-linear-gradient(90deg, rgba(255, 50, 50, var(--retro-mask, 0)) 0 1px, rgba(50, 255, 90, var(--retro-mask, 0)) 1px 2px, rgba(60, 110, 255, var(--retro-mask, 0)) 2px 3px);
      mix-blend-mode: multiply;
    }
    #retro-ui-fx .retro-vignette {
      background: radial-gradient(ellipse at center, transparent 45%, rgba(0, 0, 0, var(--retro-vignette, 0)) 100%);
    }
    #retro-ui-fx .retro-noise {
      opacity: var(--retro-noise, 0);
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='64' height='64'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
      background-size: 140px 140px;
      mix-blend-mode: overlay;
      animation: retro-grain .5s steps(4) infinite;
    }
    #retro-ui-fx .retro-flicker {
      background: #000;
      animation: retro-flicker 2.6s ease-in-out infinite;
    }
    @keyframes retro-grain {
      0% { transform: translate(0, 0); }
      25% { transform: translate(-6%, 3%); }
      50% { transform: translate(4%, -5%); }
      75% { transform: translate(-3%, 6%); }
      100% { transform: translate(0, 0); }
    }
    @keyframes retro-flicker {
      0%, 92%, 100% { opacity: 0; }
      94% { opacity: calc(var(--retro-flicker, 0) * .12); }
      96% { opacity: calc(var(--retro-flicker, 0) * .04); }
      98% { opacity: calc(var(--retro-flicker, 0) * .09); }
    }
  </style>
</head>
<body>
  <div id="game-container">
    <canvas id="stadium-canvas"></canvas>
    <div id="ui-overlay"></div>
    <div id="retro-ui-fx"><div class="retro-scan"></div><div class="retro-vignette"></div><div class="retro-noise"></div><div class="retro-flicker"></div></div>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
